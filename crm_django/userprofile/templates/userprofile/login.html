{% extends 'core/base.html' %}

{% block title %}
    Log in 
{% endblock title %}

{% block content %}
    <div class="py-6 px-6">
        <h1 class="my-4 text-xl"><strong>Log in</strong></h1>
        <form method="post" action="." class="py-4 px-4">
            {% csrf_token %}
            {{form.as_p}}
            <button class="py-4 px-6 bg-teal-500 text-white rounded-xl text-xl">Log in</button>
        </form>
    </div>
{% endblock content %}
